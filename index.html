<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Awesome Sneakers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho e menu -->
    <header class="cabecalho">

        <!-- Logo -->
        <div class="logo">
            <span class="simbolo"> ̶a̶s̶</span>
            <span class="nome-logo">awesome sneakers</span>
        </div>
        
        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About AS</a>
            <a href="#">Customer Service</a>
        </nav>

        <!-- Ícones -->
        <div class="icones">
            <span>👤</span>
            <span>🛍️</span>
        </div>

    </header>

    <!-- Imagem principal -->

        <!-- Botão sobre a imagem -->
        <div class="conteudo">
            <a href="#" class="botao">SHOP NOW</a>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="rodape">

    </footer>
